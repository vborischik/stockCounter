<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Stock Count Scanner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
<style>
  :root{
    --bg: #13150F;
    --panel: #1B1E15;
    --panel-2: #21241A;
    --line: #34382A;
    --text: #F3F1E7;
    --muted: #8C8E7C;
    --laser: #FF3B30;
    --led: #4ADE80;
    --led-dim: #2F6B44;
    --amber: #F5A623;
    --danger: #E85C4A;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  .app{
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:var(--bg);
    border-left:1px solid var(--line);
    border-right:1px solid var(--line);
  }

  /* Header */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 16px;
    border-bottom:1px solid var(--line);
    position:sticky;
    top:0;
    background:var(--bg);
    z-index:20;
  }
  .brand{display:flex;flex-direction:column;gap:2px;}
  .brand-title{
    font-family:'IBM Plex Mono',monospace;
    font-weight:700;
    letter-spacing:0.14em;
    font-size:13px;
    text-transform:uppercase;
    color:var(--text);
  }
  .brand-sub{font-size:11px;color:var(--muted);letter-spacing:0.02em;}
  .count-badge{
    font-family:'IBM Plex Mono',monospace;
    font-size:20px;
    font-weight:700;
    color:var(--led);
    text-shadow:0 0 12px rgba(74,222,128,0.35);
    font-variant-numeric:tabular-nums;
  }
  .count-label{
    font-size:9px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.12em;
    text-align:right;
  }

  /* Scanner viewfinder */
  .scan-section{padding:16px;border-bottom:1px solid var(--line);}
  .viewfinder{
    position:relative;
    width:100%;
    aspect-ratio:4/3;
    background:#000;
    border-radius:6px;
    overflow:hidden;
    border:1px solid var(--line);
  }
  .viewfinder video, .viewfinder canvas{
    position:absolute;
    top:0;left:0;width:100%;height:100%;
    object-fit:cover;
    z-index:0;
  }
  .viewfinder.idle::after{
    content:"CAMERA OFF";
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.18em;
    color:var(--muted);
    background:var(--panel);
    z-index:5;
  }
  .frame-corners{position:absolute;inset:0;z-index:3;pointer-events:none;}
  .frame-corners span{
    position:absolute;
    width:22px;height:22px;
    border-color:var(--led);
    opacity:0.85;
  }
  .fc-tl{top:10px;left:10px;border-top:2px solid var(--led);border-left:2px solid var(--led);}
  .fc-tr{top:10px;right:10px;border-top:2px solid var(--led);border-right:2px solid var(--led);}
  .fc-bl{bottom:10px;left:10px;border-bottom:2px solid var(--led);border-left:2px solid var(--led);}
  .fc-br{bottom:10px;right:10px;border-bottom:2px solid var(--led);border-right:2px solid var(--led);}
  .laser-line{
    position:absolute;
    left:6%;right:6%;
    height:2px;
    background:var(--laser);
    box-shadow:0 0 8px 1px rgba(255,59,48,0.8);
    top:50%;
    display:none;
    z-index:3;
    pointer-events:none;
  }
  .viewfinder.scanning .laser-line{display:block;animation:sweep 1.6s ease-in-out infinite;}
  @keyframes sweep{0%{top:14%;}50%{top:86%;}100%{top:14%;}}
  .viewfinder.flash{animation:flashok 0.35s ease-out;}
  @keyframes flashok{
    0%{box-shadow: inset 0 0 0 3px var(--led);}
    100%{box-shadow: inset 0 0 0 0px transparent;}
  }
  .lock-wrap{
    position:absolute;
    left:6%;right:6%;bottom:14px;
    height:4px;
    background:rgba(243,241,231,0.16);
    border-radius:2px;
    display:none;
    overflow:hidden;
    z-index:4;
    pointer-events:none;
  }
  .viewfinder.scanning .lock-wrap{display:block;}
  .lock-fill{
    height:100%;
    width:0%;
    background:var(--led);
    box-shadow:0 0 8px rgba(74,222,128,0.6);
    transition:width 0.1s linear;
  }

  .scan-controls{display:flex;gap:8px;margin-top:12px;}
  button{
    font-family:'Inter',sans-serif;
    cursor:pointer;
    border:none;
    border-radius:5px;
    font-weight:600;
  }
  .btn-primary{
    flex:1;
    background:var(--led);
    color:#0B2013;
    padding:13px 16px;
    font-size:14px;
    letter-spacing:0.01em;
  }
  .btn-primary:active{background:#3fc471;}
  .btn-stop{
    flex:1;
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text);
    padding:13px 16px;
    font-size:14px;
  }
  .btn-torch{
    width:54px;
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--muted);
    font-size:17px;
    display:none;
  }
  .btn-torch.on{color:var(--amber);border-color:var(--amber);}
  .cam-status{
    margin-top:8px;
    font-size:11px;
    color:var(--muted);
    min-height:14px;
    font-family:'IBM Plex Mono',monospace;
    line-height:1.45;
  }
  .cam-status.err{color:var(--danger);}

  /* Live decoder readout */
  .readout{
    margin-top:8px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:5px;
    padding:9px 11px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--muted);
    display:none;
    line-height:1.6;
  }
  .readout.show{display:block;}
  .readout b{color:var(--text);font-weight:500;}
  .readout .rejected{color:var(--danger);}

  /* Symbology picker */
  .fmt-label{
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.1em;
    color:var(--muted);
    margin-top:16px;
  }
  .fmt-row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
  .fmt-chip{
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--muted);
    padding:7px 12px;
    border-radius:20px;
    font-size:11px;
    font-family:'IBM Plex Mono',monospace;
    letter-spacing:0.06em;
  }
  .fmt-chip.active{border-color:var(--led);color:var(--led);}

  /* Manual entry */
  .manual-row{display:flex;gap:8px;margin-top:8px;}
  .manual-row input{
    flex:1;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:5px;
    color:var(--text);
    padding:11px 12px;
    font-family:'IBM Plex Mono',monospace;
    font-size:14px;
  }
  .manual-row input:focus{outline:1px solid var(--led);}
  .manual-row button{
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text);
    padding:0 16px;
    font-size:13px;
  }
  .manual-label{
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.1em;
    color:var(--muted);
    margin-top:16px;
  }

  /* Confirm panel */
  .confirm-overlay{
    position:fixed;
    inset:0;
    background:rgba(10,11,7,0.72);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:50;
  }
  .confirm-overlay.open{display:flex;}
  .confirm-card{
    width:100%;
    max-width:520px;
    background:var(--panel);
    border-top:1px solid var(--line);
    border-radius:14px 14px 0 0;
    padding:20px 18px 24px;
  }
  .confirm-barcode-label{
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.14em;
    color:var(--muted);
  }
  .confirm-barcode{
    font-family:'IBM Plex Mono',monospace;
    font-size:26px;
    font-weight:600;
    letter-spacing:0.04em;
    margin:4px 0 4px;
    word-break:break-all;
  }
  .confirm-meta{
    font-size:10px;
    font-family:'IBM Plex Mono',monospace;
    color:var(--muted);
    letter-spacing:0.08em;
    text-transform:uppercase;
    margin-bottom:6px;
  }
  .confirm-hint{
    font-size:12px;
    color:var(--amber);
    margin-bottom:14px;
    min-height:16px;
  }
  .qty-row{display:flex;align-items:stretch;gap:8px;margin-bottom:16px;}
  .qty-step{
    width:52px;
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text);
    font-size:20px;
    border-radius:6px;
  }
  .qty-input{
    flex:1;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:6px;
    color:var(--led);
    font-family:'IBM Plex Mono',monospace;
    font-size:28px;
    font-weight:700;
    text-align:center;
    font-variant-numeric:tabular-nums;
  }
  .qty-input:focus{outline:1px solid var(--led);}
  .confirm-actions{display:flex;gap:10px;}
  .btn-save{flex:2;background:var(--led);color:#0B2013;padding:14px;font-size:15px;}
  .btn-cancel{
    flex:1;
    background:transparent;
    border:1px solid var(--line);
    color:var(--muted);
    padding:14px;
    font-size:14px;
  }

  /* History */
  .history-section{padding:16px;flex:1;}
  .history-header{display:flex;align-items:center;justify-content:space-between;cursor:pointer;}
  .history-title{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--text);
  }
  .chevron{color:var(--muted);font-size:12px;transition:transform 0.15s;}
  .chevron.open{transform:rotate(180deg);}
  .history-body{display:none;margin-top:12px;}
  .history-body.open{display:block;}
  .search-input{
    width:100%;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:5px;
    color:var(--text);
    padding:9px 10px;
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    margin-bottom:10px;
  }
  .item-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 4px;
    border-bottom:1px solid var(--line);
  }
  .item-code{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--text);}
  .item-time{font-size:10px;color:var(--muted);margin-top:2px;}
  .item-right{display:flex;align-items:center;gap:10px;}
  .item-qty{
    font-family:'IBM Plex Mono',monospace;
    font-size:16px;
    color:var(--led);
    font-weight:700;
    min-width:40px;
    text-align:right;
    font-variant-numeric:tabular-nums;
  }
  .item-del{background:transparent;border:none;color:var(--muted);font-size:16px;padding:4px 6px;}
  .item-del:active{color:var(--danger);}
  .empty-state{color:var(--muted);font-size:12px;text-align:center;padding:24px 0;}

  /* Footer */
  .footer{
    position:sticky;
    bottom:0;
    display:flex;
    gap:8px;
    padding:12px 16px;
    background:var(--bg);
    border-top:1px solid var(--line);
  }
  .btn-export{flex:2;background:var(--amber);color:#241A02;padding:13px;font-size:14px;}
  .btn-clear{
    flex:1;
    background:transparent;
    border:1px solid var(--line);
    color:var(--danger);
    padding:13px;
    font-size:13px;
  }
  .save-note{
    text-align:center;
    font-size:10px;
    color:var(--muted);
    padding:0 16px 10px;
    letter-spacing:0.03em;
  }
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="brand">
      <div class="brand-title">Stock Count</div>
      <div class="brand-sub">Scan &rarr; enter qty &rarr; export</div>
    </div>
    <div>
      <div class="count-badge mono" id="countBadge">0</div>
      <div class="count-label">counted</div>
    </div>
  </div>

  <div class="scan-section">
    <div class="viewfinder idle" id="viewfinder">
      <div class="frame-corners">
        <span class="fc-tl"></span><span class="fc-tr"></span>
        <span class="fc-bl"></span><span class="fc-br"></span>
      </div>
      <div class="laser-line" id="laserLine"></div>
      <div class="lock-wrap"><div class="lock-fill" id="lockFill"></div></div>
    </div>
    <div class="scan-controls">
      <button class="btn-primary" id="startBtn">Start Scanning</button>
      <button class="btn-stop" id="stopBtn" style="display:none;">Stop</button>
      <button class="btn-torch" id="torchBtn" title="Light">&#9728;</button>
    </div>
    <div class="cam-status" id="camStatus"></div>
    <div class="readout" id="readout"></div>

    <div class="fmt-label">Barcode type on your labels</div>
    <div class="fmt-row" id="fmtRow">
      <button class="fmt-chip active" data-fmt="auto">ALL</button>
      <button class="fmt-chip" data-fmt="retail">EAN / UPC</button>
      <button class="fmt-chip" data-fmt="code128">CODE 128</button>
      <button class="fmt-chip" data-fmt="code39">CODE 39</button>
      <button class="fmt-chip" data-fmt="itf">ITF</button>
    </div>

    <div class="manual-label">Or enter barcode manually</div>
    <div class="manual-row">
      <input type="text" id="manualInput" inputmode="numeric" placeholder="Type or paste stock code">
      <button id="manualBtn">Add</button>
    </div>
  </div>

  <div class="history-section">
    <div class="history-header" id="historyHeader">
      <div class="history-title">Counted items</div>
      <div class="chevron" id="chevron">&#9660;</div>
    </div>
    <div class="history-body" id="historyBody">
      <input type="text" class="search-input" id="searchInput" placeholder="Filter by stock code&hellip;">
      <div id="listContainer"></div>
    </div>
  </div>

  <div class="footer">
    <button class="btn-export" id="exportBtn">Export CSV</button>
    <button class="btn-clear" id="clearBtn">Clear all</button>
  </div>
  <div class="save-note">Progress auto-saves to this browser</div>
</div>

<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-card">
    <div class="confirm-barcode-label">Stock code</div>
    <div class="confirm-barcode mono" id="confirmBarcode">—</div>
    <div class="confirm-meta" id="confirmMeta"></div>
    <div class="confirm-hint" id="confirmHint"></div>
    <div class="qty-row">
      <button class="qty-step" id="qtyMinus">&minus;</button>
      <input type="number" class="qty-input" id="qtyInput" inputmode="numeric" step="1" placeholder="0">
      <button class="qty-step" id="qtyPlus">+</button>
    </div>
    <div class="confirm-actions">
      <button class="btn-cancel" id="qtyCancel">Cancel</button>
      <button class="btn-save" id="qtySave">Save &amp; Continue</button>
    </div>
  </div>
</div>

<script>
(function(){
  const STORAGE_KEY = 'counts';
  let counts = {};
  let scanning = false;
  let awaitingConfirm = false;
  let currentBarcode = null;
  let currentSource = '';

  const el = (id) => document.getElementById(id);
  const viewfinder = el('viewfinder');
  const startBtn = el('startBtn');
  const stopBtn = el('stopBtn');
  const torchBtn = el('torchBtn');
  const camStatus = el('camStatus');
  const readout = el('readout');
  const countBadge = el('countBadge');
  const lockFill = el('lockFill');
  const fmtRow = el('fmtRow');
  const manualInput = el('manualInput');
  const manualBtn = el('manualBtn');
  const confirmOverlay = el('confirmOverlay');
  const confirmBarcode = el('confirmBarcode');
  const confirmMeta = el('confirmMeta');
  const confirmHint = el('confirmHint');
  const qtyInput = el('qtyInput');
  const qtySave = el('qtySave');
  const qtyCancel = el('qtyCancel');
  const qtyMinus = el('qtyMinus');
  const qtyPlus = el('qtyPlus');
  const historyHeader = el('historyHeader');
  const historyBody = el('historyBody');
  const chevron = el('chevron');
  const listContainer = el('listContainer');
  const searchInput = el('searchInput');
  const exportBtn = el('exportBtn');
  const clearBtn = el('clearBtn');

  // ---------- symbology sets ----------
  const FORMAT_SETS = {
    auto:    { native:['ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf','codabar'],
               quagga:['ean_reader','ean_8_reader','code_128_reader','code_39_reader'] },
    retail:  { native:['ean_13','ean_8','upc_a','upc_e'],
               quagga:['ean_reader','ean_8_reader'] },
    code128: { native:['code_128'],  quagga:['code_128_reader'] },
    code39:  { native:['code_39'],   quagga:['code_39_reader'] },
    itf:     { native:['itf'],       quagga:['i2of5_reader'] }
  };
  let currentFmt = 'auto';

  fmtRow.addEventListener('click', (e) => {
    const chip = e.target.closest('.fmt-chip');
    if(!chip) return;
    currentFmt = chip.getAttribute('data-fmt');
    [...fmtRow.querySelectorAll('.fmt-chip')].forEach(c => c.classList.toggle('active', c === chip));
    if(scanning){ stopScanning(); setTimeout(startScanning, 250); }
  });

  // ---------- storage ----------
  async function loadState(){
    try{
      const res = await window.storage.get(STORAGE_KEY, false);
      if(res && res.value){ counts = JSON.parse(res.value); }
    }catch(e){ counts = {}; }
    refreshCount();
  }
  let saveTimer = null;
  function saveState(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async () => {
      try{ await window.storage.set(STORAGE_KEY, JSON.stringify(counts), false); }
      catch(e){ console.error('save failed', e); }
    }, 150);
  }
  function refreshCount(){
    countBadge.textContent = Object.keys(counts).length.toLocaleString();
  }

  // ---------- validation ----------
  // Mod-10 is only meaningful for EAN/UPC/ITF-14. Applying it to Code 128 or
  // Code 39 payloads would silently reject perfectly good reads.
  const CHECKED_FORMATS = ['ean_13','ean_8','upc_a','upc_e','ean','upc'];
  function usesChecksum(format){
    if(!format) return false;
    const f = String(format).toLowerCase();
    return CHECKED_FORMATS.some(k => f.indexOf(k) !== -1);
  }
  function checksumOk(code){
    if(!/^\d+$/.test(code)) return true;
    if([8,12,13].indexOf(code.length) === -1) return true;
    const d = code.split('').map(Number);
    const check = d.pop();
    let sum = 0;
    d.reverse().forEach((n,i) => { sum += n * (i % 2 === 0 ? 3 : 1); });
    return ((10 - (sum % 10)) % 10) === check;
  }

  function reject(code, why){
    logRead(code, 0, why);
    return false;
  }
  function plausible(code, format){
    if(!code) return false;
    if(code.length < 4) return reject(code, 'too short');
    if(usesChecksum(format) && !checksumOk(code)) return reject(code, 'bad check digit');
    return true;
  }

  // ---------- live readout ----------
  let seenLog = [];
  function logRead(code, hits, rejectedWhy){
    const now = Date.now();
    seenLog = seenLog.filter(r => now - r.t < 6000);
    const prev = seenLog.find(r => r.code === code);
    if(prev){ prev.t = now; prev.hits = hits; prev.why = rejectedWhy; }
    else { seenLog.unshift({ code, t: now, hits: hits, why: rejectedWhy }); }
    seenLog = seenLog.slice(0, 4);
    renderReadout();
  }
  function renderReadout(){
    if(!scanning){ readout.classList.remove('show'); return; }
    readout.classList.add('show');
    if(!seenLog.length){
      readout.innerHTML = 'Decoder running · nothing read yet';
      return;
    }
    readout.innerHTML = seenLog.map(r => {
      if(r.why) return '<span class="rejected">✕ ' + esc(r.code) + ' — ' + esc(r.why) + '</span>';
      return '<b>' + esc(r.code) + '</b> · ' + r.hits + '/' + neededReads;
    }).join('<br>');
  }

  // ---------- consensus voting ----------
  let neededReads = 2;
  let votes = [];
  let VOTE_WINDOW_MS = 3000;

  function updateLock(hits){
    lockFill.style.width = Math.min(100, (hits / neededReads) * 100) + '%';
  }

  function vote(code, format){
    if(awaitingConfirm || !scanning) return;
    if(!plausible(code, format)) return;
    const now = Date.now();
    votes = votes.filter(v => now - v.t < VOTE_WINDOW_MS);
    votes.push({ code, t: now });
    const hits = votes.filter(v => v.code === code).length;
    updateLock(hits);
    logRead(code, hits, null);
    if(hits >= neededReads){
      votes = [];
      updateLock(0);
      accept(code, format);
    }
  }

  function accept(code, format){
    if(navigator.vibrate) navigator.vibrate(60);
    viewfinder.classList.add('flash');
    setTimeout(() => viewfinder.classList.remove('flash'), 350);
    openConfirm(code, format);
  }

  function esc(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ---------- engine: native BarcodeDetector ----------
  let engine = null;
  let detector = null;
  let mediaStream = null;
  let videoEl = null;
  let loopTimer = null;

  async function tryNative(){
    if(!('BarcodeDetector' in window) || !navigator.mediaDevices) return false;
    try{
      const supported = await window.BarcodeDetector.getSupportedFormats();
      const want = FORMAT_SETS[currentFmt].native.filter(f => supported.indexOf(f) !== -1);
      if(!want.length) return false;
      detector = new window.BarcodeDetector({ formats: want });

      mediaStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }
      });

      videoEl = document.createElement('video');
      videoEl.setAttribute('playsinline','');
      videoEl.playsInline = true;
      videoEl.muted = true;
      videoEl.autoplay = true;
      videoEl.srcObject = mediaStream;
      viewfinder.insertBefore(videoEl, viewfinder.firstChild);
      await videoEl.play();

      engine = 'native';
      neededReads = 2;
      VOTE_WINDOW_MS = 3000;
      tuneTrack();
      onStarted('Native decoder · hold steady over one barcode');
      nativeLoop();
      return true;
    }catch(e){
      console.error('native scanner failed', e);
      cleanupNative();
      return false;
    }
  }

  function nativeLoop(){
    const step = async () => {
      if(!scanning || engine !== 'native') return;
      if(!awaitingConfirm && videoEl && videoEl.readyState >= 2){
        try{
          const found = await detector.detect(videoEl);
          if(found.length){
            const best = found[0];
            vote(String(best.rawValue).trim(), best.format);
          }
        }catch(e){ /* transient decode error */ }
      }
      loopTimer = setTimeout(step, 70);
    };
    step();
  }

  function cleanupNative(){
    clearTimeout(loopTimer);
    loopTimer = null;
    if(mediaStream){
      mediaStream.getTracks().forEach(t => { try{ t.stop(); }catch(e){} });
      mediaStream = null;
    }
    if(videoEl && videoEl.parentNode){ videoEl.parentNode.removeChild(videoEl); }
    videoEl = null;
    detector = null;
  }

  // ---------- engine: Quagga fallback ----------
  function startQuagga(){
    Quagga.init({
      inputStream: {
        type: 'LiveStream',
        target: viewfinder,
        constraints: { facingMode: 'environment', width: 1280, height: 720 }
      },
      locator: { patchSize: 'medium', halfSample: true },
      decoder: { readers: FORMAT_SETS[currentFmt].quagga.slice() },
      locate: true,
      numOfWorkers: navigator.hardwareConcurrency ? Math.min(4, navigator.hardwareConcurrency) : 2,
      frequency: 10
    }, function(err){
      if(err){
        console.error(err);
        scanning = false;
        camStatus.textContent = 'Camera unavailable here — this can happen inside an embedded preview. Open the file directly in your phone\'s browser, or use manual entry below.';
        camStatus.classList.add('err');
        return;
      }
      Quagga.start();
      engine = 'quagga';
      neededReads = 3;
      VOTE_WINDOW_MS = 4000;
      onStarted('Fallback decoder · fill the frame width with the barcode');
      tuneTrack();
      const vc = viewfinder.querySelector('video');
      if(vc){ vc.style.position='absolute'; vc.style.top=0; vc.style.left=0; vc.style.width='100%'; vc.style.height='100%'; vc.style.objectFit='cover'; }
      const cv = viewfinder.querySelector('canvas.drawingBuffer');
      if(cv){ cv.style.display='none'; }
    });

    Quagga.onDetected(handleQuagga);
  }

  function handleQuagga(result){
    if(awaitingConfirm || !scanning) return;
    const rc = result && result.codeResult;
    if(!rc || !rc.code) return;

    const decoded = (rc.decodedCodes || []).filter(c => typeof c.error === 'number');
    if(decoded.length){
      const errs = decoded.map(c => c.error).sort((a,b) => a-b);
      const median = errs[Math.floor(errs.length/2)];
      if(median > 0.14){ logRead(rc.code, 0, 'low confidence'); return; }
    }
    vote(String(rc.code).trim(), rc.format || '');
  }

  // ---------- start / stop ----------
  async function startScanning(){
    if(scanning) return;
    camStatus.classList.remove('err');
    camStatus.textContent = 'Requesting camera…';
    votes = [];
    seenLog = [];
    updateLock(0);
    scanning = true;
    const ok = await tryNative();
    if(!ok && scanning){ startQuagga(); }
  }

  function onStarted(msg){
    viewfinder.classList.remove('idle');
    viewfinder.classList.add('scanning');
    startBtn.style.display = 'none';
    stopBtn.style.display = 'block';
    camStatus.textContent = msg;
    renderReadout();
  }

  function stopScanning(){
    scanning = false;
    if(engine === 'quagga'){
      try{ Quagga.offDetected(handleQuagga); Quagga.stop(); }catch(e){}
    }
    cleanupNative();
    engine = null;
    votes = [];
    seenLog = [];
    updateLock(0);
    torchOn = false;
    torchBtn.classList.remove('on');
    torchBtn.style.display = 'none';
    readout.classList.remove('show');
    viewfinder.classList.add('idle');
    viewfinder.classList.remove('scanning');
    startBtn.style.display = 'block';
    stopBtn.style.display = 'none';
    camStatus.textContent = '';
  }

  // ---------- camera track tuning ----------
  function activeTrack(){
    if(mediaStream) return mediaStream.getVideoTracks()[0] || null;
    try{ return Quagga.CameraAccess.getActiveTrack(); }catch(e){ return null; }
  }

  function tuneTrack(){
    setTimeout(() => {
      const track = activeTrack();
      if(!track || !track.getCapabilities) return;
      let caps = {};
      try{ caps = track.getCapabilities() || {}; }catch(e){ return; }
      if(caps.focusMode && caps.focusMode.indexOf('continuous') !== -1){
        track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(()=>{});
      }
      torchBtn.style.display = caps.torch ? 'block' : 'none';
    }, 500);
  }

  let torchOn = false;
  torchBtn.addEventListener('click', () => {
    const track = activeTrack();
    if(!track) return;
    torchOn = !torchOn;
    track.applyConstraints({ advanced: [{ torch: torchOn }] })
      .then(() => torchBtn.classList.toggle('on', torchOn))
      .catch(() => { torchOn = false; torchBtn.classList.remove('on'); });
  });

  // ---------- confirm panel ----------
  function openConfirm(barcode, source){
    awaitingConfirm = true;
    currentBarcode = barcode;
    currentSource = source || '';
    confirmBarcode.textContent = barcode;
    confirmMeta.textContent = (source ? String(source).replace(/_/g,'-') + ' · ' : '') + barcode.length + ' chars';
    const existing = counts[barcode];
    if(existing){
      confirmHint.textContent = 'Already counted — last entered: ' + existing.qty + '. Saving will overwrite it.';
      qtyInput.value = existing.qty;
    }else{
      confirmHint.textContent = 'New item';
      qtyInput.value = '';
    }
    confirmOverlay.classList.add('open');
    setTimeout(()=>{ qtyInput.focus(); qtyInput.select(); }, 50);
  }

  function closeConfirm(){
    confirmOverlay.classList.remove('open');
    awaitingConfirm = false;
    currentBarcode = null;
    votes = [];
    seenLog = [];
    updateLock(0);
    renderReadout();
  }

  function saveCurrent(){
    if(!currentBarcode) return;
    const val = qtyInput.value.trim();
    if(val === ''){ qtyInput.focus(); return; }
    counts[currentBarcode] = { qty: val, ts: Date.now() };
    saveState();
    refreshCount();
    renderList();
    closeConfirm();
  }

  qtySave.addEventListener('click', saveCurrent);
  qtyCancel.addEventListener('click', closeConfirm);
  qtyInput.addEventListener('keydown', (e) => { if(e.key === 'Enter'){ e.preventDefault(); saveCurrent(); } });
  qtyMinus.addEventListener('click', () => { qtyInput.value = (parseFloat(qtyInput.value||'0') - 1).toString(); });
  qtyPlus.addEventListener('click', () => { qtyInput.value = (parseFloat(qtyInput.value||'0') + 1).toString(); });

  startBtn.addEventListener('click', startScanning);
  stopBtn.addEventListener('click', stopScanning);

  manualBtn.addEventListener('click', () => {
    const v = manualInput.value.trim();
    if(!v) return;
    manualInput.value = '';
    openConfirm(v, 'manual');
  });
  manualInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter'){ e.preventDefault(); manualBtn.click(); }
  });

  // ---------- history list ----------
  historyHeader.addEventListener('click', () => {
    const open = historyBody.classList.toggle('open');
    chevron.classList.toggle('open', open);
    if(open) renderList();
  });

  function renderList(){
    const filter = searchInput.value.trim().toLowerCase();
    const entries = Object.entries(counts)
      .filter(([code]) => !filter || code.toLowerCase().includes(filter))
      .sort((a,b) => (b[1].ts||0) - (a[1].ts||0))
      .slice(0, 200);

    if(entries.length === 0){
      listContainer.innerHTML = '<div class="empty-state">No items counted yet.</div>';
      return;
    }
    listContainer.innerHTML = entries.map(([code, data]) => {
      const time = data.ts ? new Date(data.ts).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : '';
      return `<div class="item-row" data-code="${esc(code)}">
        <div>
          <div class="item-code">${esc(code)}</div>
          <div class="item-time">${time}</div>
        </div>
        <div class="item-right">
          <div class="item-qty">${esc(String(data.qty))}</div>
          <button class="item-del" data-del="${esc(code)}">&#10005;</button>
        </div>
      </div>`;
    }).join('');
  }

  listContainer.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-del]');
    if(btn){
      const code = btn.getAttribute('data-del');
      delete counts[code];
      saveState();
      refreshCount();
      renderList();
      return;
    }
    const row = e.target.closest('.item-row');
    if(row){ openConfirm(row.getAttribute('data-code'), 'edit'); }
  });

  searchInput.addEventListener('input', renderList);

  // ---------- export / clear ----------
  exportBtn.addEventListener('click', () => {
    const entries = Object.entries(counts);
    if(entries.length === 0){ alert('No items counted yet.'); return; }
    const csv = entries.map(([code, data]) => `${code},${data.qty}`).join('\n') + '\n';
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');
    a.href = url;
    a.download = `stock-count-${stamp}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  clearBtn.addEventListener('click', () => {
    if(Object.keys(counts).length === 0) return;
    if(!confirm('Clear all counted items? This cannot be undone.')) return;
    counts = {};
    saveState();
    refreshCount();
    renderList();
  });

  loadState();
})();
</script>
</body>
</html>
