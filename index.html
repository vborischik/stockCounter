<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Stock Count Scanner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
<style>
  :root{
    --bg: #13150F;
    --panel: #1B1E15;
    --panel-2: #21241A;
    --line: #34382A;
    --text: #F3F1E7;
    --muted: #8C8E7C;
    --laser: #FF3B30;
    --led: #4ADE80;
    --led-dim: #2F6B44;
    --amber: #F5A623;
    --danger: #E85C4A;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  .app{
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:var(--bg);
    border-left:1px solid var(--line);
    border-right:1px solid var(--line);
  }

  /* Header */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 16px;
    border-bottom:1px solid var(--line);
    position:sticky;
    top:0;
    background:var(--bg);
    z-index:20;
  }
  .brand{display:flex;flex-direction:column;gap:2px;}
  .brand-title{
    font-family:'IBM Plex Mono',monospace;
    font-weight:700;
    letter-spacing:0.14em;
    font-size:13px;
    text-transform:uppercase;
    color:var(--text);
  }
  .brand-sub{font-size:11px;color:var(--muted);letter-spacing:0.02em;}
  .count-badge{
    font-family:'IBM Plex Mono',monospace;
    font-size:20px;
    font-weight:700;
    color:var(--led);
    text-shadow:0 0 12px rgba(74,222,128,0.35);
    font-variant-numeric:tabular-nums;
  }
  .count-label{
    font-size:9px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.12em;
    text-align:right;
  }

  /* Scanner viewfinder */
  .scan-section{padding:16px;border-bottom:1px solid var(--line);}
  .viewfinder{
    position:relative;
    width:100%;
    height:360px;
    background:#000;
    border-radius:6px;
    overflow:hidden;
    border:1px solid var(--line);
  }
  @supports (aspect-ratio:4/3){
    .viewfinder{height:auto;aspect-ratio:4/3;}
  }
  .viewfinder video, .viewfinder canvas{
    position:absolute;
    top:0;left:0;width:100%;height:100%;
    object-fit:cover;
    z-index:0;
  }
  .viewfinder.idle::after{
    content:"CAMERA OFF";
    position:absolute;
    top:0;right:0;bottom:0;left:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.18em;
    color:var(--muted);
    background:var(--panel);
    z-index:5;
  }
  .frame-corners{position:absolute;top:0;right:0;bottom:0;left:0;z-index:3;pointer-events:none;}
  .frame-corners span{
    position:absolute;
    width:22px;height:22px;
    border-color:var(--led);
    opacity:0.85;
  }
  .fc-tl{top:10px;left:10px;border-top:2px solid var(--led);border-left:2px solid var(--led);}
  .fc-tr{top:10px;right:10px;border-top:2px solid var(--led);border-right:2px solid var(--led);}
  .fc-bl{bottom:10px;left:10px;border-bottom:2px solid var(--led);border-left:2px solid var(--led);}
  .fc-br{bottom:10px;right:10px;border-bottom:2px solid var(--led);border-right:2px solid var(--led);}
  .laser-line{
    position:absolute;
    left:6%;right:6%;
    height:2px;
    background:var(--laser);
    box-shadow:0 0 8px 1px rgba(255,59,48,0.8);
    top:50%;
    display:none;
    z-index:3;
    pointer-events:none;
  }
  .viewfinder.scanning .laser-line{display:block;animation:sweep 1.6s ease-in-out infinite;}
  @keyframes sweep{0%{top:14%;}50%{top:86%;}100%{top:14%;}}
  .viewfinder.flash{animation:flashok 0.35s ease-out;}
  @keyframes flashok{
    0%{box-shadow: inset 0 0 0 3px var(--led);}
    100%{box-shadow: inset 0 0 0 0px transparent;}
  }
  .lock-wrap{
    position:absolute;
    left:6%;right:6%;bottom:14px;
    height:4px;
    background:rgba(243,241,231,0.16);
    border-radius:2px;
    display:none;
    overflow:hidden;
    z-index:4;
    pointer-events:none;
  }
  .viewfinder.scanning .lock-wrap{display:block;}
  .lock-fill{
    height:100%;
    width:0%;
    background:var(--led);
    box-shadow:0 0 8px rgba(74,222,128,0.6);
    transition:width 0.1s linear;
  }

  .scan-controls{display:flex;gap:8px;margin-top:12px;}
  button{
    font-family:'Inter',sans-serif;
    cursor:pointer;
    border:none;
    border-radius:5px;
    font-weight:600;
  }
  .btn-primary{
    flex:1;
    background:var(--led);
    color:#0B2013;
    padding:13px 16px;
    font-size:14px;
    letter-spacing:0.01em;
  }
  .btn-primary:active{background:#3fc471;}
  .btn-stop{
    flex:1;
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text);
    padding:13px 16px;
    font-size:14px;
  }
  .btn-torch{
    width:54px;
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--muted);
    font-size:17px;
    display:none;
  }
  .btn-torch.on{color:var(--amber);border-color:var(--amber);}
  .cam-status{
    margin-top:8px;
    font-size:11px;
    color:var(--muted);
    min-height:14px;
    font-family:'IBM Plex Mono',monospace;
    line-height:1.45;
  }
  .cam-status.err{color:var(--danger);}

  /* Live decoder readout */
  .readout{
    margin-top:8px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:5px;
    padding:9px 11px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--muted);
    display:none;
    line-height:1.6;
  }
  .readout.show{display:block;}
  .readout b{color:var(--text);font-weight:500;}
  .readout .rejected{color:var(--danger);}

  /* Symbology picker */
  .scan-settings{margin-top:16px;}
  .scan-settings summary{cursor:pointer;}
  .fmt-label{
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.1em;
    color:var(--muted);
  }
  .fmt-row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
  .fmt-chip{
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--muted);
    padding:7px 12px;
    border-radius:20px;
    font-size:11px;
    font-family:'IBM Plex Mono',monospace;
    letter-spacing:0.06em;
  }
  .fmt-chip.active{border-color:var(--led);color:var(--led);}

  /* Manual entry */
  .manual-row{display:flex;gap:8px;margin-top:8px;}
  .manual-row input{
    flex:1;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:5px;
    color:var(--text);
    padding:11px 12px;
    font-family:'IBM Plex Mono',monospace;
    font-size:14px;
  }
  .manual-row input:focus{outline:1px solid var(--led);}
  .manual-row button{
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text);
    padding:0 16px;
    font-size:13px;
  }
  .manual-label{
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.1em;
    color:var(--muted);
    margin-top:16px;
  }

  /* Confirm panel */
  .confirm-overlay{
    position:fixed;
    top:0;right:0;bottom:0;left:0;
    background:rgba(10,11,7,0.72);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:50;
  }
  .confirm-overlay.open{display:flex;}
  .confirm-card{
    width:100%;
    max-width:520px;
    background:var(--panel);
    border-top:1px solid var(--line);
    border-radius:14px 14px 0 0;
    padding:20px 18px 24px;
    max-height:100%;
    overflow:auto;
  }
  .confirm-barcode-label{
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.14em;
    color:var(--muted);
  }
  .confirm-barcode{
    font-family:'IBM Plex Mono',monospace;
    font-size:26px;
    font-weight:600;
    letter-spacing:0.04em;
    margin:4px 0 4px;
    word-break:break-all;
  }
  .confirm-meta{
    font-size:10px;
    font-family:'IBM Plex Mono',monospace;
    color:var(--muted);
    letter-spacing:0.08em;
    text-transform:uppercase;
    margin-bottom:6px;
  }
  .confirm-hint{
    font-size:12px;
    color:var(--amber);
    margin-bottom:14px;
    min-height:16px;
  }
  .confirm-product{font-size:15px;font-weight:600;overflow-wrap:break-word;}
  .qty-summary,.inventory-stats{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:8px;
    margin:8px 0 12px;
    font-size:11px;
    color:var(--muted);
  }
  .qty-summary strong,.inventory-stats strong{display:block;font-size:15px;color:var(--text);}
  .difference-negative,.qty-summary .difference-negative{color:var(--danger);}
  .difference-match,.qty-summary .difference-match{color:var(--led);}
  .entry-status{font-size:12px;color:var(--danger);margin-top:6px;}
  .entry-status:empty{display:none;}
  .inventory-tools{margin-bottom:14px;}
  .inventory-tools button,.btn-add-count,.list-more{
    background:var(--panel);color:var(--text);border:1px solid var(--line);
    border-radius:5px;padding:8px 10px;font-size:13px;
  }
  .inventory-status{font-size:12px;color:var(--muted);margin-top:6px;}
  .inventory-tools .btn-clear-inventory{color:var(--danger);}
  .btn-add-count{margin-top:8px;width:100%;}
  .btn-remove-count{color:var(--danger);}
  .list-more{margin-top:8px;width:100%;}
  .item-row>div:first-child{min-width:0;overflow-wrap:break-word;}
  [hidden]{display:none!important;}
  .qty-row{display:flex;align-items:stretch;gap:8px;margin-bottom:16px;}
  .qty-step{
    width:52px;
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text);
    font-size:20px;
    border-radius:6px;
  }
  .qty-input{
    flex:1;
    min-width:0;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:6px;
    color:var(--led);
    font-family:'IBM Plex Mono',monospace;
    font-size:28px;
    font-weight:700;
    text-align:center;
    font-variant-numeric:tabular-nums;
  }
  .qty-input:focus{outline:1px solid var(--led);}
  .confirm-actions{display:flex;gap:10px;}
  .btn-save{flex:2;background:var(--led);color:#0B2013;padding:14px;font-size:15px;}
  .btn-cancel{
    flex:1;
    background:transparent;
    border:1px solid var(--line);
    color:var(--muted);
    padding:14px;
    font-size:14px;
  }

  /* History */
  .history-section{padding:16px;flex:1;}
  .history-header{display:flex;align-items:center;justify-content:space-between;cursor:pointer;}
  .history-title{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--text);
  }
  .chevron{color:var(--muted);font-size:12px;transition:transform 0.15s;}
  .chevron.open{transform:rotate(180deg);}
  .history-body{display:none;margin-top:12px;}
  .history-body.open{display:block;}
  .search-input{
    width:100%;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:5px;
    color:var(--text);
    padding:9px 10px;
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    margin-bottom:10px;
  }
  .item-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 4px;
    border-bottom:1px solid var(--line);
  }
  .item-code{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--text);}
  .item-time{font-size:10px;color:var(--muted);margin-top:2px;}
  .item-right{display:flex;align-items:center;gap:10px;}
  .item-quantities{display:flex;align-items:flex-start;}
  .item-quantity{text-align:right;margin-left:8px;}
  .item-quantity-label{display:block;font-size:10px;color:var(--muted);}
  .item-qty{
    font-family:'IBM Plex Mono',monospace;
    font-size:16px;
    color:var(--led);
    font-weight:700;
    min-width:40px;
    text-align:right;
    font-variant-numeric:tabular-nums;
  }
  .item-qty-system{color:var(--text);}
  .item-del{background:transparent;border:none;color:var(--muted);font-size:16px;padding:4px 6px;}
  .item-del:active{color:var(--danger);}
  .empty-state{color:var(--muted);font-size:12px;text-align:center;padding:24px 0;}

  /* Footer */
  .footer{
    position:sticky;
    bottom:0;
    display:flex;
    gap:8px;
    padding:12px 16px;
    background:var(--bg);
    border-top:1px solid var(--line);
  }
  .btn-export{flex:2;background:var(--amber);color:#241A02;padding:13px;font-size:14px;}
  .btn-clear{
    flex:1;
    background:transparent;
    border:1px solid var(--line);
    color:var(--danger);
    padding:13px;
    font-size:13px;
  }
  .save-note{
    text-align:center;
    font-size:10px;
    color:var(--muted);
    padding:0 16px 10px;
    letter-spacing:0.03em;
  }
  
@media (max-width: 375px){
  .scan-section{padding:10px 8px 12px;}
  .viewfinder{height:80vw;min-height:220px;max-height:300px;aspect-ratio:auto;}
  .manual-row input{min-width:0;font-size:16px;}
  .confirm-card{padding:12px;}
  .confirm-barcode{font-size:16px;}
  .confirm-hint,.qty-row{margin-bottom:8px;}
  .footer{flex-wrap:wrap;}
  .footer button{padding:9px;font-size:12px;}
}

</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="brand">
      <div class="brand-title">Stock Count</div>
      <div class="brand-sub">Scan &rarr; enter qty &rarr; export</div>
    </div>
    <div>
      <div class="count-badge mono" id="countBadge">0</div>
      <div class="count-label">counted</div>
    </div>
  </div>

  <div class="scan-section">
    <div class="viewfinder idle" id="viewfinder">
      <div class="frame-corners">
        <span class="fc-tl"></span><span class="fc-tr"></span>
        <span class="fc-bl"></span><span class="fc-br"></span>
      </div>
      <div class="laser-line" id="laserLine"></div>
      <div class="lock-wrap"><div class="lock-fill" id="lockFill"></div></div>
    </div>
    <div class="scan-controls">
      <button class="btn-primary" id="startBtn">Start Scanning</button>
      <button class="btn-stop" id="stopBtn" style="display:none;">Stop</button>
      <button class="btn-torch" id="torchBtn" title="Light">&#9728;</button>
    </div>
    <div class="cam-status" id="camStatus"></div>
    <div class="readout" id="readout"></div>

    <div class="manual-label">Or enter barcode manually</div>
    <div class="manual-row">
      <input type="text" id="manualInput" inputmode="numeric" placeholder="Type or paste stock code">
      <button id="manualBtn">Add</button>
    </div>

    <div class="entry-status" id="entryStatus" role="status"></div>
    <details class="scan-settings">
      <summary class="fmt-label">Scanner settings · Barcode types</summary>
      <div class="fmt-row" id="fmtRow">
        <button class="fmt-chip active" data-fmt="auto">ALL</button>
        <button class="fmt-chip" data-fmt="retail">EAN / UPC</button>
        <button class="fmt-chip" data-fmt="code128">CODE 128</button>
        <button class="fmt-chip" data-fmt="code39">CODE 39</button>
        <button class="fmt-chip" data-fmt="itf">ITF</button>
      </div>
    </details>
  </div>

  <div class="history-section">
    <div class="inventory-tools">
      <button type="button" id="importBtn" disabled>Import Inventory</button>
      <button type="button" class="btn-clear-inventory" id="clearInventoryBtn" disabled>Clear Imported Data</button>
      <input type="file" id="inventoryFile" accept=".csv,text/csv" hidden>
      <div class="inventory-status" id="inventoryStatus" role="status"></div>
      <div class="inventory-stats" id="inventoryStats" hidden></div>
    </div>
    <div class="history-header" id="historyHeader">
      <div class="history-title">Counted items</div>
      <div class="chevron" id="chevron">&#9660;</div>
    </div>
    <div class="history-body" id="historyBody">
      <input type="text" class="search-input" id="searchInput" placeholder="Filter by stock code&hellip;">
      <div id="listContainer"></div>
      <button type="button" id="listMore" class="list-more" hidden>Show more</button>
    </div>
  </div>

  <div class="footer">
    <button class="btn-export" id="exportBtn">Export CSV</button>
    <button class="btn-export" id="detailExportBtn" hidden>Export Details</button>
    <button class="btn-export" id="restoreCountsBtn" disabled>Restore Counted CSV</button>
    <input type="file" id="restoreCountsFile" accept=".csv,text/csv" hidden>
    <button class="btn-clear" id="clearBtn">Clear Counts</button>
  </div>
  <div class="save-note" id="restoreCountsStatus" role="status"></div>
  <div class="save-note">Progress auto-saves to this browser</div>
</div>

<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-card">
    <div class="confirm-product" id="confirmProduct" hidden></div>
    <div class="confirm-barcode-label">Stock code</div>
    <div class="confirm-barcode mono" id="confirmBarcode">—</div>
    <div class="confirm-meta" id="confirmMeta"></div>
    <div class="qty-summary" id="confirmSummary" hidden></div>
    <div class="confirm-hint" id="confirmHint"></div>
    <div class="qty-row">
      <button class="qty-step" id="qtyMinus">&minus;</button>
      <input type="number" class="qty-input" id="qtyInput" inputmode="numeric" step="1" placeholder="0">
      <button class="qty-step" id="qtyPlus">+</button>
    </div>
    <div class="confirm-actions">
      <button class="btn-cancel" id="qtyCancel">Cancel</button>
      <button class="btn-save" id="qtySave">Save &amp; Continue</button>
    </div>
    <button type="button" class="btn-add-count" id="qtyAdd">Add to Count</button>
    <button type="button" class="btn-add-count btn-remove-count" id="qtyRemove" hidden>Remove Count</button>
  </div>
</div>

<script>
(function(){
  const STORAGE_KEY = 'counts';
  let counts = Object.create(null);
  let catalog = null;
  let stockReport = null;
  let loadingCatalog = true;
  let listLimit = 200;
  let scanning = false;
  let awaitingConfirm = false;
  let currentBarcode = null;
  let currentUPC = '';
  let addingCount = false;

  const el = (id) => document.getElementById(id);
  const viewfinder = el('viewfinder');
  const startBtn = el('startBtn');
  const stopBtn = el('stopBtn');
  const torchBtn = el('torchBtn');
  const camStatus = el('camStatus');
  const readout = el('readout');
  const entryStatus = el('entryStatus');
  const importBtn = el('importBtn');
  const inventoryFile = el('inventoryFile');
  const inventoryStatus = el('inventoryStatus');
  const inventoryStats = el('inventoryStats');
  const clearInventoryBtn = el('clearInventoryBtn');
  const listMore = el('listMore');
  const detailExportBtn = el('detailExportBtn');
  const countBadge = el('countBadge');
  const lockFill = el('lockFill');
  const fmtRow = el('fmtRow');
  const manualInput = el('manualInput');
  const manualBtn = el('manualBtn');
  const confirmOverlay = el('confirmOverlay');
  const confirmBarcode = el('confirmBarcode');
  const confirmMeta = el('confirmMeta');
  const confirmHint = el('confirmHint');
  const confirmProduct = el('confirmProduct');
  const confirmSummary = el('confirmSummary');
  const qtyAdd = el('qtyAdd');
  const qtyRemove = el('qtyRemove');
  const qtyInput = el('qtyInput');
  const qtySave = el('qtySave');
  const qtyCancel = el('qtyCancel');
  const qtyMinus = el('qtyMinus');
  const qtyPlus = el('qtyPlus');
  const historyHeader = el('historyHeader');
  const historyBody = el('historyBody');
  const chevron = el('chevron');
  const listContainer = el('listContainer');
  const searchInput = el('searchInput');
  const exportBtn = el('exportBtn');
  const clearBtn = el('clearBtn');
  const restoreCountsBtn = el('restoreCountsBtn');
  const restoreCountsFile = el('restoreCountsFile');
  const restoreCountsStatus = el('restoreCountsStatus');

  // ---------- symbology sets ----------
  const FORMAT_SETS = {
    auto:    { native:['ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf','codabar'],
               quagga:['ean_reader','ean_8_reader','code_128_reader','code_39_reader'] },
    retail:  { native:['ean_13','ean_8','upc_a','upc_e'],
               quagga:['ean_reader','ean_8_reader'] },
    code128: { native:['code_128'],  quagga:['code_128_reader'] },
    code39:  { native:['code_39'],   quagga:['code_39_reader'] },
    itf:     { native:['itf'],       quagga:['i2of5_reader'] }
  };
  let currentFmt = 'auto';

  fmtRow.addEventListener('click', async (e) => {
    const chip = e.target.closest('.fmt-chip');
    if(!chip) return;
    currentFmt = chip.getAttribute('data-fmt');
    [...fmtRow.querySelectorAll('.fmt-chip')].forEach(c => c.classList.toggle('active', c === chip));
    if(cameraStartup) await cameraStartup.catch(() => {});
    if(scanning && !cameraStartup){
      stopScanning();
      startScanning();
    }
  });

  // ---------- storage ----------
  // Saves go to localStorage synchronously, so nothing is pending if Safari
  // reloads or discards the tab right after a save.
  const LS_KEY = 'stockcounter.counts';

  function lsGet(){
    try{ return localStorage.getItem(LS_KEY); }catch(e){ return null; }
  }
  function lsSet(value){
    try{ localStorage.setItem(LS_KEY, value); return true; }
    catch(e){ console.error('localStorage save failed', e); return false; }
  }

  async function loadState(){
    let raw = lsGet();
    // Fallback for the Claude artifact viewer, where window.storage exists.
    if(!raw && window.storage && window.storage.get){
      try{
        const res = await window.storage.get(STORAGE_KEY, false);
        if(res && res.value){ raw = res.value; }
      }catch(e){}
    }
    try{ if(raw) Object.assign(counts, JSON.parse(raw)); }catch(e){}
    refreshCount();
    renderListIfOpen();
  }

  function saveState(){
    const json = JSON.stringify(counts);
    const ok = lsSet(json);
    if(window.storage && window.storage.set){
      window.storage.set(STORAGE_KEY, json, false).catch(()=>{});
    }else if(!ok){
      camStatus.textContent = 'Warning: could not save to this browser (Private Browsing?). Export CSV often.';
      camStatus.classList.add('err');
    }
  }

  // Ask the browser not to evict this site's storage.
  if(navigator.storage && navigator.storage.persist){
    navigator.storage.persist().catch(()=>{});
  }
  function refreshCount(){
    countBadge.textContent = Object.keys(counts).length.toLocaleString();
    renderInventoryStats();
  }

  // ---------- BottlePOS catalog ----------
  const inventoryColumns = ['Stock Code', 'UPC Full', 'Name', 'Size', 'Qty On Hand', 'Total Qty On Hand'];
  const numberFormat = new Intl.NumberFormat(undefined, {maximumFractionDigits: 8});

  function parseCSV(text){
    const rows = [];
    let row = [], value = '', quoted = false, closed = false;
    text = text.replace(/^\uFEFF/, '');
    for(let i = 0; i < text.length; i++){
      const char = text[i];
      if(quoted){
        if(char === '"' && text[i + 1] === '"'){ value += '"'; i++; }
        else if(char === '"'){ quoted = false; closed = true; }
        else value += char;
      }else if(char === ',' || char === '\r' || char === '\n'){
        row.push(value);
        value = '';
        closed = false;
        if(char !== ','){
          rows.push(row);
          row = [];
          if(char === '\r' && text[i + 1] === '\n') i++;
        }
      }else if(char === '"' && !value && !closed){
        quoted = true;
      }else{
        if(closed || char === '"') throw new Error('Invalid CSV quoting near record ' + (rows.length + 1) + '.');
        value += char;
      }
    }
    if(quoted) throw new Error('The CSV contains an unclosed quoted field.');
    if(row.length || value || closed) rows.push(row.concat(value));
    return rows;
  }

  function readInventoryCSV(text){
    const rows = parseCSV(text);
    const header = (rows.shift() || []).map(field => field.trim());
    if(['ID', 'Location', 'Qty'].every(name => header.includes(name)) && !header.includes('Stock Code')){
      return readStockReport(header, rows);
    }
    const idColumn = header.indexOf('ID');
    const ids = new Set();
    const columns = inventoryColumns.map(name => header.indexOf(name));
    if(columns.includes(-1)) throw new Error('Select a BottlePOS inventory CSV with the required stock and quantity columns.');
    const products = new Map();
    rows.forEach((row, index) => {
      if(row.every(field => !field.trim())) return;
      const [stockCode, upc, name, size, qtyOnHand, total] = columns.map(column => (row[column] || '').trim());
      const systemQty = Number(total.replace(/,/g, ''));
      if(row.length !== header.length || !stockCode || !total || !Number.isFinite(systemQty) || products.has(stockCode)){
        throw new Error('Invalid or duplicate product in CSV record ' + (index + 2) + '.');
      }
      const id = (row[idColumn] || '').trim();
      if(id && ids.has(id)) throw new Error('Duplicate BottlePOS ID in CSV record ' + (index + 2) + '.');
      if(id) ids.add(id);
      products.set(stockCode, {id, stockCode, upc, name, size, qtyOnHand, systemQty});
    });
    if(!products.size) throw new Error('No inventory products were found in the CSV.');
    return {importedAt: Date.now(), products: Array.from(products.values()), stockReport};
  }

  function readStockReport(header, rows){
    const columns = ['ID', 'Qty'].map(name => header.indexOf(name));
    const totals = new Map();
    rows.forEach((row, index) => {
      if(row.every(field => !field.trim())) return;
      const [id, value] = columns.map(column => (row[column] || '').trim());
      const qty = Number(value.replace(/,/g, ''));
      const total = (totals.get(id) || 0) + qty;
      if(row.length !== header.length || !id || !value || !Number.isFinite(total)){
        throw new Error('Invalid stock quantity in CSV record ' + (index + 2) + '.');
      }
      totals.set(id, total);
    });
    if(!totals.size) throw new Error('No stock report quantities were found.');
    return {importedAt: catalog ? catalog.importedAt : null,
      products: catalog ? Array.from(catalog.products.values()) : [],
      stockReport: {importedAt: Date.now(), totals: Array.from(totals.entries())}};

  }

  function barcodeKey(code){
    const digits = code.replace(/^\+(?=\d+$)/, '');
    return normalize(/^0\d{13}$/.test(digits) ? digits.slice(1) : digits, '');
  }

  function indexCatalog(record){
    const products = new Map();
    const exact = new Map();
    const normalized = new Map();
    function register(index, code, product){
      if(index.has(code) && index.get(code) !== product) index.set(code, null);
      else index.set(code, product);
    }
    record.products.forEach(product => {
      products.set(product.stockCode, product);
      const codes = [product.stockCode].concat(product.stockCode.split(','), product.upc.split(','));
      codes.map(code => code.trim()).filter(Boolean).forEach(code => {
        register(exact, code, product);
        register(normalized, barcodeKey(code), product);
      });
    });
    const stockReport = record.stockReport;
    const stockTotals = new Map(stockReport ? stockReport.totals : []);
    const ids = new Set(record.products.map(product => product.id).filter(Boolean));
    let stockMatches = 0;
    stockTotals.forEach((qty, id) => { if(ids.has(id)) stockMatches++; });
    return {products, exact, normalized, importedAt: record.importedAt, stockReport, stockTotals, stockMatches, hasProductIds: ids.size > 0};
  }

  function findProduct(code){
    return catalog.products.get(code) ||
      (catalog.exact.has(code) ? catalog.exact.get(code) : catalog.normalized.get(barcodeKey(code)));
  }

  function inventoryRecord(record){
    return new Promise((resolve, reject) => {
      if(!window.indexedDB){ reject(new Error('IndexedDB is unavailable.')); return; }
      const open = window.indexedDB.open('stockcounter.inventory', 1);
      open.onupgradeneeded = () => open.result.createObjectStore('catalog');
      open.onerror = () => reject(open.error);
      open.onsuccess = () => {
        const db = open.result;
        const transaction = db.transaction('catalog', record === undefined ? 'readonly' : 'readwrite');
        const store = transaction.objectStore('catalog');
        let request;
        if(record === null) request = store.delete('current');
        else if(record === undefined) request = store.get('current');
        else request = store.put(record, 'current');
        transaction.oncomplete = () => { db.close(); resolve(request.result); };
        transaction.onabort = () => { db.close(); reject(transaction.error || request.error); };
      };
    });
  }

  function activateCatalog(record){
    stockReport = record.stockReport || null;
    if(!record.products.length){
      renderInventoryStats();
      return;
    }
    if(awaitingConfirm) closeConfirm();
    catalog = indexCatalog(record);
    // Migrate standalone counts by UPC. When aliases were counted separately,
    // keep the most recently entered quantity without adding counts together.
    let migrated = false;
    Object.keys(counts).forEach(code => {
      const count = counts[code];
      if(count.stockCode) return;
      if(catalog.products.has(code)){
        count.stockCode = code;
        migrated = true;
        return;
      }
      const product = findProduct(code);
      if(!product) return;
      const stockCode = product.stockCode;
      if(!counts[stockCode] || count.ts > counts[stockCode].ts){
        counts[stockCode] = Object.assign({}, count, {stockCode, upc: code});
      }
      delete counts[code];
      migrated = true;
    });
    if(migrated) saveState();
    historyBody.classList.add('open');
    chevron.classList.add('open');
    inventoryStats.hidden = false;
    detailExportBtn.hidden = false;
    searchInput.placeholder = 'Search name, stock code or UPC…';
    listLimit = 200;
    entryStatus.textContent = '';
    refreshCount();
    renderList();
  }

  function readFile(file){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(reader.error);
      reader.readAsText(file);
    });
  }

  importBtn.addEventListener('click', () => inventoryFile.click());
  inventoryFile.addEventListener('change', async () => {
    const file = inventoryFile.files[0];
    if(!file || importBtn.disabled) return;
    importBtn.disabled = true;
    clearInventoryBtn.disabled = true;
    inventoryFile.value = '';
    inventoryStatus.textContent = 'Importing inventory…';
    try{
      const record = readInventoryCSV(await readFile(file));
      await inventoryRecord(record);
      if(scanning) stopScanning();
      activateCatalog(record);
    }catch(error){
      const message = error && error.message ? error.message : 'Browser storage failed.';
      inventoryStatus.textContent = 'Import failed. ' + message;
    }finally{
      importBtn.disabled = false;
      clearInventoryBtn.disabled = !catalog && !stockReport;
    }
  });

  clearInventoryBtn.addEventListener('click', async () => {
    if(importBtn.disabled || (!catalog && !stockReport)) return;
    if(!confirm('Clear the imported items and stock report? Saved counts will be kept.')) return;
    importBtn.disabled = true;
    clearInventoryBtn.disabled = true;
    try{
      await inventoryRecord(null);
      if(awaitingConfirm) closeConfirm();
      catalog = null;
      stockReport = null;
      inventoryStats.hidden = true;
      detailExportBtn.hidden = true;
      searchInput.placeholder = 'Filter by stock code…';
      entryStatus.textContent = '';
      refreshCount();
      renderListIfOpen();
      inventoryStatus.textContent = 'Imported data cleared. Saved counts were kept.';
    }catch(error){
      inventoryStatus.textContent = 'Could not clear imported data.';
    }finally{
      importBtn.disabled = false;
      clearInventoryBtn.disabled = !catalog && !stockReport;
    }
  });

  function difference(count, product){
    return count ? Number((Number(count.qty) - product.systemQty).toFixed(8)) : null;
  }

  function differenceClass(value){
    return value < 0 ? 'difference-negative' : value === 0 ? 'difference-match' : '';
  }

  function statistic(label, value, className){
    return '<div>' + label + '<strong class="' + (className || '') + '">' +
      (value === null ? '—' : numberFormat.format(value)) + '</strong></div>';
  }

  function renderInventoryStats(){
    const reportSaved = stockReport ? 'Stock report saved (' +
      numberFormat.format(stockReport.totals.length) + ' IDs). Import the BottlePOS items CSV to match barcodes.' : '';
    if(!catalog){
      inventoryStatus.textContent = reportSaved;
      return;
    }
    let counted = 0, different = 0, systemQty = 0, countedQty = 0, missing = 0;
    catalog.products.forEach(product => {
      systemQty += product.systemQty;
      const count = counts[product.stockCode];
      if(count){
        counted++;
        countedQty += Number(count.qty);
        if(difference(count, product) !== 0) different++;
      }
    });
    Object.keys(counts).forEach(code => { if(!catalog.products.has(code)) missing++; });
    const total = catalog.products.size;
    inventoryStatus.textContent = numberFormat.format(total) + ' products imported ' +
      new Date(catalog.importedAt).toLocaleString() +
      (missing ? '. ' + missing + ' saved count(s) reference items missing from inventory.' : '');
    if(stockReport && !catalog.hasProductIds){
      inventoryStatus.textContent += '. ' + reportSaved;
    }else if(stockReport){
      inventoryStatus.textContent += '. Stock report imported ' +
        new Date(catalog.stockReport.importedAt).toLocaleString() + ' (' +
        numberFormat.format(catalog.stockMatches) + ' matched, ' +
        numberFormat.format(catalog.stockTotals.size - catalog.stockMatches) + ' unmatched IDs).';
    }
    inventoryStats.innerHTML = statistic('Catalog products', total) + statistic('Counted products', counted) +
      statistic('Remaining products', total - counted) + statistic('With differences', different) +
      statistic('Total system qty', systemQty) + statistic('Total counted qty', countedQty);
  }

  // ---------- validation ----------
  // Mod-10 is only meaningful for EAN/UPC/ITF-14. Applying it to Code 128 or
  // Code 39 payloads would silently reject perfectly good reads.
  const CHECKED_FORMATS = ['ean_13','ean_8','upc_a','upc_e','ean','upc'];
  function usesChecksum(format){
    if(!format) return false;
    const f = String(format).toLowerCase();
    return CHECKED_FORMATS.some(k => f.indexOf(k) !== -1);
  }
  function checksumOk(code){
    if(!/^\d+$/.test(code)) return true;
    if([8,12,13].indexOf(code.length) === -1) return true;
    const d = code.split('').map(Number);
    const check = d.pop();
    let sum = 0;
    d.reverse().forEach((n,i) => { sum += n * (i % 2 === 0 ? 3 : 1); });
    return ((10 - (sum % 10)) % 10) === check;
  }

  // A UPC-A label is physically a 12-digit code, but EAN-13 decoders report it
  // padded with a leading zero. Prefixes 0xx are reserved for UPC-A, so a
  // 13-digit result starting with 0 is always the padded form — strip it back.
  function normalize(code, format){
    const f = String(format || '').toLowerCase();
    const looksEan = f === '' || f.indexOf('ean') !== -1 || f.indexOf('upc_a') !== -1;
    if(looksEan && /^0\d{12}$/.test(code)) return code.slice(1);
    return code;
  }

  function reject(code, why){
    logRead(code, 0, why);
    return false;
  }
  function plausible(code, format){
    if(!code) return false;
    if(code.length < 4) return reject(code, 'too short');
    if(usesChecksum(format) && !checksumOk(code)) return reject(code, 'bad check digit');
    return true;
  }

  // ---------- live readout ----------
  let seenLog = [];
  function logRead(code, hits, rejectedWhy){
    const now = Date.now();
    seenLog = seenLog.filter(r => now - r.t < 6000);
    const prev = seenLog.find(r => r.code === code);
    if(prev){ prev.t = now; prev.hits = hits; prev.why = rejectedWhy; }
    else { seenLog.unshift({ code, t: now, hits: hits, why: rejectedWhy }); }
    seenLog = seenLog.slice(0, 4);
    renderReadout();
  }
  function renderReadout(){
    if(!scanning){ readout.classList.remove('show'); return; }
    readout.classList.add('show');
    if(!seenLog.length){
      readout.innerHTML = 'Decoder running · nothing read yet';
      return;
    }
    readout.innerHTML = seenLog.map(r => {
      if(r.why) return '<span class="rejected">✕ ' + esc(r.code) + ' — ' + esc(r.why) + '</span>';
      return '<b>' + esc(r.code) + '</b> · ' + r.hits + '/' + neededReads;
    }).join('<br>');
  }

  // ---------- consensus voting ----------
  let neededReads = 2;
  let votes = [];
  let VOTE_WINDOW_MS = 3000;

  function updateLock(hits){
    lockFill.style.width = Math.min(100, (hits / neededReads) * 100) + '%';
  }

  function vote(code, format){
    if(awaitingConfirm || !scanning) return;
    if(!catalog) code = normalize(code, format);
    if(!code || (!catalog && !plausible(code, format))) return;
    const now = Date.now();
    votes = votes.filter(v => now - v.t < VOTE_WINDOW_MS);
    votes.push({ code, t: now });
    const hits = votes.filter(v => v.code === code).length;
    updateLock(hits);
    logRead(code, hits, null);
    if(hits >= neededReads){
      votes = [];
      updateLock(0);
      accept(code, format);
    }
  }

  function accept(code, format){
    if(!openConfirm(code, format)) return;
    if(navigator.vibrate) navigator.vibrate(60);
    viewfinder.classList.add('flash');
    setTimeout(() => viewfinder.classList.remove('flash'), 350);
  }

  function esc(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ---------- engine: native BarcodeDetector ----------
  let engine = null;
  let detector = null;
  let mediaStream = null;
  let videoEl = null;
  let loopTimer = null;
  let cameraStartup = null;

  async function tryNative(){
    if(!('BarcodeDetector' in window) || !navigator.mediaDevices) return false;
    try{
      const supported = await window.BarcodeDetector.getSupportedFormats();
      if(!scanning) return false;
      const want = FORMAT_SETS[currentFmt].native.filter(f => supported.indexOf(f) !== -1);
      if(!want.length) return false;
      detector = new window.BarcodeDetector({ formats: want });

      mediaStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }
      });

      if(!scanning){
        cleanupNative();
        return false;
      }

      videoEl = document.createElement('video');
      videoEl.setAttribute('playsinline','');
      videoEl.playsInline = true;
      videoEl.muted = true;
      videoEl.autoplay = true;
      videoEl.srcObject = mediaStream;
      viewfinder.insertBefore(videoEl, viewfinder.firstChild);
      await videoEl.play();
      if(!scanning) return false;

      engine = 'native';
      neededReads = 2;
      VOTE_WINDOW_MS = 3000;
      tuneTrack();
      onStarted('Native decoder · hold steady over one barcode');
      nativeLoop();
      return true;
    }catch(e){
      console.error('native scanner failed', e);
      cleanupNative();
      return false;
    }
  }

  function nativeLoop(){
    const video = videoEl;
    const step = async () => {
      if(!scanning || videoEl !== video) return;
      if(!awaitingConfirm && videoEl && videoEl.readyState >= 2){
        try{
          const found = await detector.detect(videoEl);
          if(found.length && videoEl === video){
            const best = found[0];
            vote(String(best.rawValue).trim(), best.format);
          }
        }catch(e){ /* transient decode error */ }
      }
      if(videoEl === video) loopTimer = setTimeout(step, 70);
    };
    step();
  }

  function cleanupNative(){
    clearTimeout(loopTimer);
    loopTimer = null;
    if(mediaStream){
      mediaStream.getTracks().forEach(t => { try{ t.stop(); }catch(e){} });
      mediaStream = null;
    }
    if(videoEl && videoEl.parentNode){ videoEl.parentNode.removeChild(videoEl); }
    videoEl = null;
    detector = null;
  }

  // ---------- engine: Quagga fallback ----------
  function startQuagga(){
    return new Promise((resolve, reject) => Quagga.init({
      inputStream: {
        type: 'LiveStream',
        target: viewfinder,
        constraints: { facingMode: 'environment', width: 1280, height: 720 }
      },
      locator: { patchSize: 'medium', halfSample: true },
      decoder: { readers: FORMAT_SETS[currentFmt].quagga.slice() },
      locate: true,
      numOfWorkers: navigator.hardwareConcurrency ? Math.min(4, navigator.hardwareConcurrency) : 2,
      frequency: 10
    }, function(err){
      if(!scanning){
        try{
          if(!err) Quagga.stop();
          resolve();
        }catch(e){
          reject(e);
        }
        return;
      }
      if(err){
        console.error(err);
        scanning = false;
        camStatus.textContent = 'Camera unavailable here — this can happen inside an embedded preview. Open the file directly in your phone\'s browser, or use manual entry below.';
        camStatus.classList.add('err');
        resolve();
        return;
      }
      Quagga.onDetected(handleQuagga);
      Quagga.start();
      engine = 'quagga';
      neededReads = 3;
      VOTE_WINDOW_MS = 4000;
      onStarted('Fallback decoder · fill the frame width with the barcode');
      tuneTrack();
      const vc = viewfinder.querySelector('video');
      if(vc){ vc.style.position='absolute'; vc.style.top=0; vc.style.left=0; vc.style.width='100%'; vc.style.height='100%'; vc.style.objectFit='cover'; }
      const cv = viewfinder.querySelector('canvas.drawingBuffer');
      if(cv){ cv.style.display='none'; }
      resolve();
    }));
  }

  function handleQuagga(result){
    if(awaitingConfirm || !scanning) return;
    const rc = result && result.codeResult;
    if(!rc || !rc.code) return;

    const decoded = (rc.decodedCodes || []).filter(c => typeof c.error === 'number');
    if(decoded.length){
      const errs = decoded.map(c => c.error).sort((a,b) => a-b);
      const median = errs[Math.floor(errs.length/2)];
      if(median > 0.14){ logRead(rc.code, 0, 'low confidence'); return; }
    }
    vote(String(rc.code).trim(), rc.format || '');
  }

  // ---------- start / stop ----------
  async function startScanning(){
    if(loadingCatalog || scanning || cameraStartup) return;
    entryStatus.textContent = '';
    startBtn.disabled = true;
    camStatus.classList.remove('err');
    camStatus.textContent = 'Requesting camera…';
    votes = [];
    seenLog = [];
    updateLock(0);
    scanning = true;
    cameraStartup = (async () => {
      const ok = await tryNative();
      if(!ok && scanning) await startQuagga();
    })();
    try{
      await cameraStartup;
    }catch(e){
      stopScanning();
      camStatus.textContent = 'Camera unavailable. You can enter the barcode manually.';
      camStatus.classList.add('err');
      console.error(e);
    }finally{
      cameraStartup = null;
      startBtn.disabled = false;
    }
  }

  function onStarted(msg){
    viewfinder.classList.remove('idle');
    viewfinder.classList.add('scanning');
    startBtn.style.display = 'none';
    stopBtn.style.display = 'block';
    camStatus.textContent = msg;
    renderReadout();
  }

  function stopScanning(){
    scanning = false;
    if(engine === 'quagga'){
      try{ Quagga.offDetected(handleQuagga); Quagga.stop(); }catch(e){}
    }
    cleanupNative();
    engine = null;
    votes = [];
    seenLog = [];
    updateLock(0);
    torchOn = false;
    torchBtn.classList.remove('on');
    torchBtn.style.display = 'none';
    readout.classList.remove('show');
    viewfinder.classList.add('idle');
    viewfinder.classList.remove('scanning');
    startBtn.style.display = 'block';
    stopBtn.style.display = 'none';
    camStatus.textContent = '';
  }

  // ---------- camera track tuning ----------
  function activeTrack(){
    if(mediaStream) return mediaStream.getVideoTracks()[0] || null;
    try{ return Quagga.CameraAccess.getActiveTrack(); }catch(e){ return null; }
  }

  function tuneTrack(){
    setTimeout(() => {
      if(!scanning || !engine) return;
      const track = activeTrack();
      if(!track || !track.getCapabilities) return;
      let caps = {};
      try{ caps = track.getCapabilities() || {}; }catch(e){ return; }
      if(caps.focusMode && caps.focusMode.indexOf('continuous') !== -1){
        track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(()=>{});
      }
      torchBtn.style.display = caps.torch ? 'block' : 'none';
    }, 500);
  }

  let torchOn = false;
  torchBtn.addEventListener('click', () => {
    const track = activeTrack();
    if(!track) return;
    torchOn = !torchOn;
    track.applyConstraints({ advanced: [{ torch: torchOn }] })
      .then(() => torchBtn.classList.toggle('on', torchOn))
      .catch(() => { torchOn = false; torchBtn.classList.remove('on'); });
  });

  // ---------- confirm panel ----------
  function openConfirm(barcode, source){
    const editing = source === 'edit';
    const product = catalog && (editing ? catalog.products.get(barcode) : findProduct(barcode));
    if(catalog && !product && !editing){
      entryStatus.textContent = 'Barcode not found in inventory';
      return false;
    }
    entryStatus.textContent = '';
    awaitingConfirm = true;
    currentBarcode = product ? product.stockCode : barcode;
    const existing = counts[currentBarcode];
    currentUPC = editing ? (existing && existing.upc) || '' : barcode;
    confirmBarcode.textContent = currentBarcode;
    confirmProduct.hidden = !product;
    confirmSummary.hidden = !product;
    if(product){
      confirmProduct.textContent = product.name + (product.size && product.size !== 'NULL' ? ' · ' + product.size : '');
      confirmMeta.textContent = 'UPC ' + (currentUPC || product.upc || '—');
      const delta = difference(existing, product);
      confirmSummary.innerHTML = statistic('System Qty', product.systemQty) +
        statistic('Counted Qty', existing ? Number(existing.qty) : null) +
        statistic('Difference', delta, differenceClass(delta));
      if(catalog.stockReport){
        const stockQty = catalog.stockTotals.get(product.id);
        confirmSummary.innerHTML += statistic('Stock Report Qty', stockQty === undefined ? null : stockQty);
      }
    }else{
      confirmMeta.textContent = catalog ? 'Missing from inventory' :
        (source ? String(source).replace(/_/g, '-') + ' · ' : '') + barcode.length + ' chars';
    }
    setCountMode(Boolean(existing));
    confirmOverlay.classList.add('open');
    setTimeout(() => { if(awaitingConfirm) qtyInput.focus(); }, 50);
    return true;
  }

  function setCountMode(add){
    addingCount = add;
    const existing = counts[currentBarcode];
    qtyInput.value = !add && existing ? existing.qty : '';
    qtySave.textContent = add ? 'Add to Count' : existing ? 'Update Count' : 'Save Count';
    qtyAdd.textContent = add ? 'Update Count' : 'Add to Count';
    qtyAdd.hidden = !existing;
    qtyRemove.hidden = !existing;
    confirmHint.textContent = add ? 'Current count: ' + existing.qty + '. Enter the quantity to add.' :
      existing ? 'Saving replaces the previous count.' : 'Enter the physical quantity.';
  }

  function closeConfirm(){
    confirmOverlay.classList.remove('open');
    awaitingConfirm = false;
    currentBarcode = null;
    votes = [];
    seenLog = [];
    updateLock(0);
    renderReadout();
  }

  function saveCurrent(){
    if(!currentBarcode) return;
    const val = qtyInput.value.trim();
    const existing = counts[currentBarcode];
    const previous = existing ? Number(existing.qty) : 0;
    const qty = addingCount ? Number((previous + Number(val)).toFixed(8)) : val;
    if(!val || !Number.isFinite(Number(qty))){ qtyInput.focus(); return; }
    const count = {qty, ts: Date.now()};
    if(catalog && catalog.products.has(currentBarcode)){
      count.stockCode = currentBarcode;
      count.upc = currentUPC || (existing && existing.upc) || '';
    }else if(existing && existing.stockCode){
      count.stockCode = existing.stockCode;
      count.upc = existing.upc;
    }
    counts[currentBarcode] = count;
    saveState();
    refreshCount();
    renderListIfOpen();
    closeConfirm();
  }

  qtyAdd.addEventListener('click', () => {
    setCountMode(!addingCount);
    qtyInput.focus();
  });
  qtyRemove.addEventListener('click', () => {
    if(!currentBarcode || !counts[currentBarcode] || !confirm('Remove the saved count for this item?')) return;
    removeCount(currentBarcode);
    closeConfirm();
  });
  qtySave.addEventListener('click', saveCurrent);
  qtyCancel.addEventListener('click', closeConfirm);
  qtyInput.addEventListener('keydown', (e) => { if(e.key === 'Enter'){ e.preventDefault(); saveCurrent(); } });
  qtyMinus.addEventListener('click', () => { qtyInput.value = (parseFloat(qtyInput.value||'0') - 1).toString(); });
  qtyPlus.addEventListener('click', () => { qtyInput.value = (parseFloat(qtyInput.value||'0') + 1).toString(); });

  startBtn.addEventListener('click', startScanning);
  stopBtn.addEventListener('click', stopScanning);

  function stopForManualEntry(){
    if(scanning) stopScanning();
  }

  manualInput.addEventListener('focus', stopForManualEntry);
  manualInput.addEventListener('input', () => {
    stopForManualEntry();
    entryStatus.textContent = '';
  });
  manualBtn.addEventListener('click', () => {
    const v = manualInput.value.trim();
    if(!v || loadingCatalog) return;
    stopForManualEntry();
    if(openConfirm(v, 'manual')) manualInput.value = '';
  });
  manualInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter'){ e.preventDefault(); manualBtn.click(); }
  });

  // ---------- inventory and history ----------
  historyHeader.addEventListener('click', () => {
    const open = historyBody.classList.toggle('open');
    chevron.classList.toggle('open', open);
    renderListIfOpen();
  });

  function renderListIfOpen(){
    if(historyBody.classList.contains('open')) renderList();
  }

  function renderList(){
    const query = searchInput.value.trim().toLowerCase();
    const rows = Object.keys(counts).map(code => ({
      code, count: counts[code], product: catalog && catalog.products.get(code)
    })).filter(({code, product}) => {
      const fields = product ? [code, product.upc, product.name, product.size] : [code];
      return !query || fields.some(field => field.toLowerCase().includes(query));
    });
    rows.sort((a,b) => (b.count.ts || 0) - (a.count.ts || 0));
    listMore.hidden = rows.length <= listLimit;
    listContainer.innerHTML = rows.length ? rows.slice(0, listLimit).map(renderItem).join('') :
      (query ? '<div class="empty-state">No matching counts.</div>' : '<div class="empty-state">No items counted yet.</div>');
  }

  function renderItem({code, count, product}){
    const time = count && count.ts ?
      new Date(count.ts).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : '';
    const delta = product ? difference(count, product) : null;
    const stockQty = product && catalog.stockTotals.get(product.id);
    const reported = stockQty !== undefined && product ? ' · Stock report ' + numberFormat.format(stockQty) : '';
    const variance = delta === null ? '' : ' · <span class="' + differenceClass(delta) +
      '">Difference ' + numberFormat.format(delta) + '</span>';
    const metadata = product ? esc(code + (product.size && product.size !== 'NULL' ? ' · ' + product.size : '')) :
      catalog ? 'Missing from inventory' : esc(time);
    return `<div class="item-row" data-code="${esc(code)}">
      <div>
        <div class="item-code">${esc(product ? product.name || code : code)}</div>
        <div class="item-time">${metadata}${reported}${variance}</div>
      </div>
      <div class="item-right">
        <div class="item-quantities">
          <div class="item-quantity">
            <span class="item-quantity-label">System Qty</span>
            <div class="item-qty item-qty-system">${product ? numberFormat.format(product.systemQty) : '—'}</div>
          </div>
          <div class="item-quantity">
            <span class="item-quantity-label">Counted Qty</span>
            <div class="item-qty">${esc(String(count.qty))}</div>
          </div>
        </div>
        ${count ? '<button class="item-del" aria-label="Remove count" data-del="' + esc(code) + '">&#10005;</button>' : ''}
      </div>
    </div>`;
  }

  function removeCount(code){
    delete counts[code];
    saveState();
    refreshCount();
    renderListIfOpen();
  }

  listContainer.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-del]');
    if(btn){
      removeCount(btn.getAttribute('data-del'));
      return;
    }
    const row = e.target.closest('.item-row');
    if(row) openConfirm(row.getAttribute('data-code'), 'edit');
  });

  function resetList(){
    listLimit = 200;
    renderList();
  }
  searchInput.addEventListener('input', resetList);
  listMore.addEventListener('click', () => { listLimit += 200; renderList(); });

  // ---------- exports ----------
  function csvCell(value){
    const text = value === null || value === undefined ? '' : String(value);
    return /[",\r\n]/.test(text) ? '"' + text.replace(/"/g, '""') + '"' : text;
  }

  function downloadCSV(rows, prefix, newline){
    const csv = rows.map(row => row.map(csvCell).join(',')).join(newline) + newline;
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');
    a.href = url;
    a.download = prefix + stamp + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  exportBtn.addEventListener('click', () => {
    const entries = Object.entries(counts);
    if(!entries.length){ alert('No items counted yet.'); return; }
    downloadCSV(entries.map(([code, count]) => {
      const product = catalog && catalog.products.get(code);
      const upc = product && product.upc.split(',')[0].trim();
      return [count.upc || upc || code, count.qty];
    }), 'stock-count-', '\n');
  });

  detailExportBtn.addEventListener('click', () => {
    if(!catalog) return;
    const rows = [['Stock Code','UPC','Product Name','Size','System Qty','Counted Qty','Difference','Last Counted Date']];
    function countedColumns(count){
      return [count ? count.qty : '', count && count.ts ? new Date(count.ts).toISOString() : ''];
    }
    catalog.products.forEach(product => {
      const count = counts[product.stockCode];
      const [quantity, date] = countedColumns(count);
      rows.push([product.stockCode, product.upc, product.name, product.size,
        product.systemQty, quantity, difference(count, product), date]);
    });
    Object.keys(counts).forEach(code => {
      if(catalog.products.has(code)) return;
      const count = counts[code];
      const [quantity, date] = countedColumns(count);
      rows.push([code, count.upc || '', '', '', '', quantity, '', date]);
    });
    downloadCSV(rows, 'stock-count-details-', '\r\n');
  });

  function restoredCounts(text){
    const pending = Object.assign(Object.create(null), counts);
    const rows = parseCSV(text).filter(row => row.some(cell => cell.trim()));
    const header = rows[0]?.map(cell => cell.trim().toLowerCase());
    if(header?.length === 2 && ['barcode', 'upc', 'stock code'].includes(header[0]) &&
       ['qty', 'quantity', 'counted qty', 'counted quantity'].includes(header[1])) rows.shift();
    if(!rows.length) throw new Error('The CSV has no counted items.');

    let added = 0;
    const seen = new Map();
    for(const row of rows){
      const [barcode, qty] = row.map(cell => cell.trim());
      if(row.length !== 2 || !barcode || !/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(qty) ||
         !Number.isFinite(Number(qty))){
        throw new Error('Expected a barcode and quantity on every row.');
      }
      const product = catalog ? findProduct(barcode) : null;
      const code = product ? product.stockCode : barcode;
      if(seen.has(code) && seen.get(code) !== Number(qty)){
        throw new Error('Conflicting quantities for ' + code + '.');
      }
      seen.set(code, Number(qty));
      if(Object.hasOwn(pending, code)) continue;
      const count = {qty, ts: Date.now()};
      if(product){
        count.stockCode = code;
        count.upc = barcode;
      }
      pending[code] = count;
      added++;
    }
    return {pending, added, skipped: rows.length - added};
  }

  restoreCountsBtn.addEventListener('click', () => restoreCountsFile.click());
  restoreCountsFile.addEventListener('change', async () => {
    const file = restoreCountsFile.files[0];
    restoreCountsFile.value = '';
    if(!file) return;
    restoreCountsBtn.disabled = true;
    try{
      const {pending, added, skipped} = restoredCounts(await readFile(file));
      if(added){
        if(!lsSet(JSON.stringify(pending))) throw new Error('This browser could not save the counts.');
        counts = pending;
        refreshCount();
        renderListIfOpen();
      }
      restoreCountsStatus.textContent = 'Restored ' + added + ' counts. Skipped ' + skipped + ' existing or repeated rows.';
    }catch(error){
      restoreCountsStatus.textContent = 'Restore failed. ' + error.message;
    }finally{
      restoreCountsBtn.disabled = false;
    }
  });

  clearBtn.addEventListener('click', () => {
    if(Object.keys(counts).length === 0) return;
    if(!confirm('Clear all counted items? This cannot be undone.')) return;
    counts = Object.create(null);
    saveState();
    refreshCount();
    renderList();
  });

  async function initialize(){
    startBtn.disabled = true;
    manualBtn.disabled = true;
    await loadState();
    try{
      const record = await inventoryRecord();
      if(record) activateCatalog(record);
      importBtn.disabled = false;
      clearInventoryBtn.disabled = !catalog && !stockReport;
    }catch(error){
      inventoryStatus.textContent = 'Inventory storage is unavailable in this browser.';
    }finally{
      loadingCatalog = false;
      restoreCountsBtn.disabled = false;
      startBtn.disabled = false;
      manualBtn.disabled = false;
    }
  }

  initialize();
})();
</script>
</body>
</html>
